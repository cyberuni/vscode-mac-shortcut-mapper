name: pull-request
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read
  packages: read

jobs:
  code:
    uses: repobuddy/.github/.github/workflows/pnpm-verify.yml@v2
    with:
      os: '["ubuntu-latest"]'
      node-version: '[24]'
      # Codecov is not wired up for this extension. Leave Playwright on: the extension
      # tests launch VS Code, which needs the Linux virtual display that v2 starts only
      # when skip-playwright is false. There is no Playwright here, so no browsers install.
      skip-codecov: true
