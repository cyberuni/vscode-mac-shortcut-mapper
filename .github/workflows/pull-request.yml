name: pull-request
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read
  packages: read

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@v1
    with:
      os: '["ubuntu-latest"]'
      node-version: '[24]'
      # No browser tests here, and codecov is not wired up for this extension.
      skip-playwright: true
      skip-codecov: true
